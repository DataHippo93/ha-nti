set_zone_override:
  target:
    entity:
      integration: nti_net
      domain: climate
  fields:
    zone:
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    temperature:
      required: true
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    until:
      selector:
        datetime:
    gateway:
      selector:
        text:

clear_zone_override:
  target:
    entity:
      integration: nti_net
      domain: climate
  fields:
    zone:
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    gateway:
      selector:
        text:

set_holiday:
  fields:
    until:
      selector:
        datetime:
    gateway:
      selector:
        text:
